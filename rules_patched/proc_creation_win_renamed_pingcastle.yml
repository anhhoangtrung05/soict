title: Renamed PingCastle Binary Execution
id: 2433a154-bb3d-42e4-86c3-a26bdac91c45
status: test
description: Detects the execution of a renamed "PingCastle" binary based on the PE metadata fields.
references:
    - https://thedfirreport.com/2023/10/30/netsupport-intrusion-results-in-domain-compromise/
    - https://www.pingcastle.com/documentation/scanner/
author: Nasreddine Bencherchali (Nextron Systems), X__Junior (Nextron Systems)
date: 2024-01-11
modified: 2026-10-29
tags:
    - attack.execution
    - attack.t1059
    - attack.defense-evasion
    - attack.t1202
logsource:
    category: process_creation
    product: windows
detection:
    selection_orig:
        OriginalFileName:
            - 'PingCastleReporting.exe'
            - 'PingCastleCloud.exe'
            - 'PingCastle.exe'
    selection_cmd_scanner:
        CommandLine|contains: '--scanner'
    selection_cmd_args:
        CommandLine|contains:
            - 'aclcheck'
            - 'antivirus'
            - 'computerversion'
            - 'foreignusers'
            - 'laps_bitlocker'
            - 'localadmin'
            - 'nullsession'
            - 'nullsession-trust'
            - 'oxidbindings'
            - 'remote'
            - 'share'
            - 'smb'
            - 'smb3querynetwork'
            - 'spooler'
            - 'startup'
            - 'zerologon'
    selection_cmd_other:
        - CommandLine|contains: '--no-enum-limit'
        - CommandLine|contains|all:
              - '--healthcheck'
              - '--level Full'
        - CommandLine|contains|all:
              - '--healthcheck'
              - '--server '
    filter_main_img:
        Image|endswith:
            - '\PingCastleReporting.exe'
            - '\PingCastleCloud.exe'
            - '\PingCastle.exe'
    condition: selection_orig and ((selection_cmd_scanner and selection_cmd_args) or selection_cmd_other) and not 1 of filter_main_*
falsepositives:
    - Unknown
level: high
