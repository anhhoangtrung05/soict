title: Potentially Suspicious ASP.NET Compilation Via AspNetCompiler
id: 9f50fe98-fe5c-4a2d-86c7-fad7f63ed622
related:
    - id: 9ccba514-7cb6-4c5c-b377-700758f2f120
      type: similar
    - id: 4c7f49ee-2638-43bb-b85b-ce676c30b260
      type: similar
    - id: a01b8329-5953-4f73-ae2d-aa01e1f35f00
      type: similar
status: test
description: Detects execution of "aspnet_compiler.exe" with potentially suspicious paths for compilation.
references:
    - https://lolbas-project.github.io/lolbas/Binaries/Aspnet_Compiler/
    - https://ijustwannared.team/2020/08/01/the-curious-case-of-aspnet_compiler-exe/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-08-14
modified: 2026-10-30
tags:
    - attack.defense-evasion
    - attack.t1127
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|contains:
            - ':\Windows\Microsoft.NET\Framework\'
            - ':\Windows\Microsoft.NET\Framework64\'
            - ':\Windows\Microsoft.NET\FrameworkArm\'
            - ':\Windows\Microsoft.NET\FrameworkArm64\'
        Image|endswith: '\aspnet_compiler.exe'
    selection_paths:
        CommandLine|contains:
            - '\Users\Public\'
            - '\AppData\Local\Temp\'
            - '\AppData\Local\Roaming\'
            - ':\Temp\'
            - ':\Windows\Temp\'
            - ':\Windows\System32\Tasks\'
            - ':\Windows\Tasks\'
            - '/Windows/Temp/'
            - '/AppData/Local/Temp/'
            - '/AppData/Local/Roaming/'
            - '/Users/Public/'
    selection_regex:
        CommandLine|re: '(?i)[:/](Windows\\(\.\\)?Temp|AppData\\Local\\(\.\\)?Temp)'
    condition: selection_image and (selection_paths or selection_regex)
falsepositives:
    - Unknown
level: high
