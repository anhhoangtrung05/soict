title: Remote Access Tool - AnyDesk Silent Installation
id: 114e7f1c-f137-48c8-8f54-3088c24ce4b9
status: test
description: Detects AnyDesk Remote Desktop silent installation. Which can be used by attackers to gain remote access.
references:
    - https://twitter.com/TheDFIRReport/status/1423361119926816776?s=20
    - https://support.anydesk.com/Automatic_Deployment
author: Ján Trenčanský
date: 2021-08-06
modified: 2026-10-30
tags:
    - attack.command-and-control
    - attack.t1219.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_install:
        CommandLine|contains:
            - '--install'
            - '/install'
            - '--inst""all'
    selection_start:
        CommandLine|contains:
            - '--start-with-win'
            - '/start-with-win'
    selection_silent:
        CommandLine|contains:
            - '--silent'
            - '/silent'
    condition: selection_install and selection_start and selection_silent
fields:
    - CommandLine
    - ParentCommandLine
    - CurrentDirectory
falsepositives:
    - Legitimate deployment of AnyDesk
level: high
